<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline data · A · Search and tray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  /* Search: one field across the top of the page, opening a panel of answers. */
  .finder { position: relative; margin-bottom: 14px; }
  .finder-field { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--rule); border-radius: 10px; padding: 0 14px; height: 48px; background: #fff; }
  .finder-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .finder-field input { flex: 1; border: 0; outline: 0; font-size: 16px; background: none; }
  .finder-field svg { color: var(--muted); flex: none; }
  .try { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .try button { border: 0; background: var(--panel); border-radius: 999px; padding: 3px 11px; font-size: 13px; }
  .try button:hover { background: var(--accent-soft); color: var(--accent); }

  .results { display: none; position: absolute; left: 0; right: 0; top: 54px; z-index: 20; background: #fff; border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: 0 16px 40px rgba(16, 24, 40, .16); max-height: 70vh; overflow: auto; }
  .finder.open .results { display: block; }
  .topic { padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); }
  .topic-head { display: flex; align-items: baseline; gap: 10px; }
  .topic-head h3 { margin: 0; font-size: 15px; }
  .topic-head .add-all { margin-left: auto; }
  .heard { color: var(--muted); font-size: 12.5px; margin: 2px 0 8px; }
  .heard::before { content: 'In the news: '; font-weight: 600; color: #475467; }
  .intent { margin: 6px 0 4px; }
  .intent h4 { margin: 0 0 2px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .opt { display: grid; grid-template-columns: 22px minmax(180px, 1.3fr) 96px 2fr auto; gap: 10px; align-items: center; width: 100%; text-align: left;
    border: 0; background: none; padding: 5px 6px; border-radius: 6px; }
  .opt:hover { background: var(--panel); }
  .opt .tick { width: 18px; height: 18px; border: 1.5px solid #c9ced6; border-radius: 4px; display: grid; place-items: center; font-size: 12px; color: #fff; }
  .opt.on .tick { background: var(--accent); border-color: var(--accent); }
  .opt .name { font-weight: 500; }
  .opt .name small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; line-height: 1.3; }
  .opt .name em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 0 5px; margin-left: 6px; }
  .opt .why { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  .opt .meta { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .lands { font-size: 11.5px; }
  .lands.new { color: var(--warn); }
  .missing { margin: 8px 0 0; padding: 7px 10px; background: var(--warn-soft); border-radius: 6px; font-size: 12.5px; color: #7a3e06; }
  .missing b { font-weight: 600; }
  .plain { padding: 10px 16px 14px; }
  .plain h4 { margin: 0 0 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

  /* The tray: everything on the chart, grouped the way the charts are. */
  .tray { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-start; padding: 12px 0 14px; border-bottom: 1px solid var(--rule); }
  .tray-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding-top: 6px; }
  .bundle { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid var(--rule); border-radius: 9px; padding: 5px 6px 5px 10px; }
  .bundle-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: #fff; border-radius: 999px; padding: 2px 4px 2px 8px; font-size: 13px; }
  .chip .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .chip button { border: 0; background: none; width: 22px; height: 22px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; padding: 0; }
  .chip button:hover { background: var(--panel); color: var(--text); }
  .chip.off { border-style: dashed; color: var(--muted); background: var(--panel); }
  .chip.off .sw { background: transparent; border: 1.5px solid var(--c); }
  .chip.off .gg-freq { opacity: .4; }
  .ctx { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .ctx .chip { padding-right: 9px; }
  .ctx .chip.off { text-decoration: line-through; text-decoration-color: #c9ced6; }

  .controls { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; padding: 10px 0; font-size: 13px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 4px 10px; font-size: 12.5px; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .empty { padding: 60px 0; text-align: center; color: var(--muted); }
  .why-stack { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">Gov<b>Graph</b></span>
  <nav class="nav"><span>Executive</span><span>Congress</span><span>Supreme Court</span><span>U.S. Code</span><span class="on">Timeline</span><span>Economy</span></nav>
  <span class="variant-tag"><a href="index.html">Design variants</a> · A · Search and tray</span>
</div>
<main class="page">
  <h1>Timeline</h1>
  <p class="lede">Search for what you want to see. Each thing you add joins the tray; series measured alike share a chart, others stack beneath it on the same dates.</p>

  <div class="finder" id="finder">
    <label class="finder-field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" autocomplete="off" placeholder="Search data: unemployment, taxes, gas prices, the Fed, tariffs…">
      <span class="kbd">/</span>
    </label>
    <div class="results" id="results"></div>
    <div class="try">Try
      <button data-q="unemployment">Unemployment</button><button data-q="taxes">Taxes</button><button data-q="gas prices">Gas prices</button>
      <button data-q="the fed">The Fed</button><button data-q="inflation">Inflation</button><button data-q="tariffs">Tariffs</button>
      <button data-q="debt">Debt</button><button data-q="housing">Housing</button>
    </div>
  </div>

  <div class="tray" id="tray"></div>
  <div class="controls">
    <span>Share a chart when
      <span class="seg" id="rule"><button data-v="unit" class="on">measured alike</button><button data-v="subject">alike and same subject</button></span>
    </span>
    <span>Years <span class="seg" id="range"><button data-v="1980">1980–</button><button data-v="1993" class="on">1993–</button><button data-v="2015">2015–</button><button data-v="2020">2020–</button></span></span>
  </div>
  <div id="chart"></div>
  <p class="why-stack" id="why"></p>
</main>

<script src="shared/data.js"></script>
<script src="shared/catalog.js"></script>
<script src="shared/chart.js"></script>
<script>
const { h } = GG;
const colors = GG.colorKeeper();
const state = {
  lines: [
    { slug: 'unemployment-rate', on: true }, { slug: 'unemployment-u6', on: true },
    { slug: 'fed-funds', on: true, band: ['fed-target-lower', 'fed-target-upper'] },
    { slug: 'gasoline-retail', on: true }, { slug: 'cpi', on: false },
  ],
  context: { presidents: true, recessions: true, 'tax-laws': false, fomc: false, 'tariff-actions': false, relief: false },
  rule: 'unit', from: 1993,
};
const clean = name => name.replace(/ \((monthly|daily)\)/, '');
const has = slug => state.lines.find(l => l.slug === slug);

function toggle(slug, band) {
  const l = has(slug);
  if (l) { state.lines = state.lines.filter(x => x !== l); colors.free(slug); }
  else state.lines.push({ slug, on: true, band });
  draw();
}

// ── Results ───────────────────────────────────────────────
const q = document.getElementById('q'), finder = document.getElementById('finder'), results = document.getElementById('results');
function showResults() {
  const text = q.value.trim();
  if (!text) { finder.classList.remove('open'); return; }
  const topics = GG.searchTopics(text).slice(0, 2);
  const seen = new Set(topics.flatMap(t => t.intents.flatMap(i => i.series.map(s => s.slug))));
  const plain = GG.searchSeries(text).filter(s => !seen.has(s.slug)).slice(0, 8);
  const active = state.lines.filter(l => l.on);
  const option = (slug, role, why, band, headline) => {
    const s = GG.series(slug), on = !!has(slug);
    const shares = GG.wouldShare(slug, active.filter(l => l.slug !== slug), state.rule);
    return `<button class="opt${on ? ' on' : ''}" data-slug="${slug}" ${band ? `data-band="${band.join(',')}"` : ''}>
      <span class="tick">${on ? '✓' : ''}</span>
      <span class="name">${role && !headline ? role : clean(s.name)}${headline ? '<em>what the news means</em>' : ''}${role && !headline ? `<small>${clean(s.name)}</small>` : ''}</span>
      ${GG.sparkline(slug)}
      <span class="why">${why ?? s.description?.split('. ')[0] ?? ''}</span>
      <span class="meta">${GG.freqBadge(slug)} ${new Date(s.first).getUTCFullYear()}–${new Date(s.last).getUTCFullYear()} · ${s.sourceName}
        ${on ? '' : `<span class="lands${shares ? '' : ' new'}">${shares ? '· joins a chart' : '· new chart'}</span>`}</span>
    </button>`;
  };
  results.innerHTML = topics.map(t => `
    <div class="topic">
      <div class="topic-head"><h3>${t.label}</h3><span class="muted" style="font-size:12.5px">${t.intents.length} ways to look at it</span>
        <button class="btn add-all" data-topic="${t.id}">Add the headline</button></div>
      <p class="heard">${t.heard}</p>
      ${t.intents.map(i => `<div class="intent"><h4>${i.label}</h4>${i.series.map(s => option(s.slug, s.role, s.why, s.band, s.slug === t.headline)).join('')}</div>`).join('')}
      ${(t.missing ?? []).map(m => `<p class="missing"><b>Not here yet.</b> ${m}</p>`).join('')}
    </div>`).join('')
    + (plain.length ? `<div class="plain"><h4>Series named “${text}”</h4>${plain.map(s => option(s.slug, null, null)).join('')}</div>` : '')
    + (!topics.length && !plain.length ? `<div class="plain muted">Nothing called “${text}”. Try a word from the news: jobs, prices, taxes, the Fed.</div>` : '');
  finder.classList.add('open');
}
q.addEventListener('input', showResults);
q.addEventListener('focus', showResults);
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } if (e.key === 'Escape') finder.classList.remove('open'); });
document.addEventListener('mousedown', e => { if (!finder.contains(e.target)) finder.classList.remove('open'); });
results.addEventListener('click', e => {
  const opt = e.target.closest('.opt');
  if (opt) { toggle(opt.dataset.slug, opt.dataset.band?.split(',')); showResults(); return; }
  const all = e.target.closest('[data-topic]');
  if (all) { const t = GG.topic(all.dataset.topic); const s = t.intents.flatMap(i => i.series).find(x => x.slug === t.headline); if (!has(s.slug)) toggle(s.slug, s.band); (t.events ?? []).forEach(ev => state.context[ev] = true); draw(); showResults(); }
});
document.querySelectorAll('.try button').forEach(b => b.onclick = () => { q.value = b.dataset.q; q.focus(); showResults(); });

// ── Tray and chart ────────────────────────────────────────
function draw() {
  const lines = state.lines.map(l => ({ ...l, color: colors.get(l.slug) }));
  const shown = lines.filter(l => l.on);
  const panels = GG.groupPanels(shown, state.rule);
  const all = GG.groupPanels(lines, state.rule);
  const tray = document.getElementById('tray');
  tray.innerHTML = '<span class="tray-label">On the timeline</span>';
  all.forEach(p => {
    const b = h('div', 'bundle');
    const n = panels.findIndex(x => x.key === p.key);
    b.innerHTML = `<span class="bundle-label">${n >= 0 ? `Chart ${n + 1} · ` : 'Hidden · '}${p.title}</span>`;
    for (const l of p.lines) {
      const s = GG.series(l.slug);
      const c = h('span', `chip${l.on ? '' : ' off'}`);
      c.style.setProperty('--c', l.color);
      c.title = `${s.name} · ${s.sourceName} · ${GG.FREQ[s.frequency].name}${s.shown ? `, shown as ${s.shown}` : ''}`;
      c.innerHTML = `<i class="sw"></i>${s.name.replace(/ \(monthly\)| \(daily\)/, '')} ${GG.freqBadge(l.slug)}
        <button data-eye="${l.slug}" aria-label="${l.on ? 'Hide' : 'Show'}">${l.on ? eye : eyeOff}</button>
        <button data-x="${l.slug}" aria-label="Remove">×</button>`;
      b.appendChild(c);
    }
    tray.appendChild(b);
  });
  const ctx = h('div', 'ctx');
  ctx.innerHTML = '<span class="tray-label" style="padding:0 4px 0 6px">Context</span>' + Object.entries({ presidents: 'Presidents', ...GG_CONTEXT.eventSets })
    .map(([k, label]) => `<button class="chip${state.context[k] ? '' : ' off'}" data-ctx="${k}">${label}</button>`).join('');
  tray.appendChild(ctx);

  const chart = document.getElementById('chart');
  const why = document.getElementById('why');
  if (!shown.length) { chart.innerHTML = '<div class="empty">Nothing on the chart. Search above, or turn a series back on in the tray.</div>'; why.textContent = ''; return; }
  const sets = Object.keys(GG_CONTEXT.eventSets).filter(k => state.context[k] && k !== 'recessions');
  GG.render(chart, {
    panels, from: Date.UTC(state.from, 0, 1), to: Date.UTC(2026, 9, 11),
    context: { presidents: state.context.presidents, recessions: state.context.recessions }, events: GG.eventsFor(sets),
  });
  why.textContent = panels.length > 1 ? `${panels.length} charts: ${panels.map(p => p.title.toLowerCase()).join(', ')} are measured differently, so they are stacked on the same dates rather than drawn against one scale.` : '';
}
const eye = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const eyeOff = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.9M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 4.4-1"/></svg>';
document.getElementById('tray').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.eye) { const l = has(t.dataset.eye); l.on = !l.on; }
  if (t.dataset.x) { state.lines = state.lines.filter(l => l.slug !== t.dataset.x); colors.free(t.dataset.x); }
  if (t.dataset.ctx) state.context[t.dataset.ctx] = !state.context[t.dataset.ctx];
  draw();
});
for (const [id, key, cast] of [['rule', 'rule', String], ['range', 'from', Number]]) {
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = cast(b.dataset.v);
    document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle('on', x === b));
    draw();
  });
}
window.addEventListener('resize', draw);
draw();
const preset = new URLSearchParams(location.search).get('q');
if (preset) { q.value = preset; showResults(); }
</script>
</body>
</html>
